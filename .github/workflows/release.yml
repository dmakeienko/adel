name: Release

on:
  workflow_call:

permissions: {}

concurrency:
  group: release-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release_please:
    name: Release Please
    runs-on: ubuntu-latest
    # Only used by the GITHUB_TOKEN fallback below; the GitHub App token
    # carries its own permissions.
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      # Exposed as env so the step-level `if` can test whether the App is
      # configured (secrets can't be referenced in `if` directly).
      RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # PRs opened with GITHUB_TOKEN don't trigger workflows automatically
      # ("workflows awaiting approval"). A GitHub App token makes the release
      # PR behave like any other PR. See docs/release-automation.md.
      - name: Generate GitHub App token
        id: app-token
        if: env.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

  goreleaser:
    name: GoReleaser
    needs: release_please
    if: needs.release_please.outputs.release_created
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.release_please.outputs.tag_name }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build UI
        run: make build-ui

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ needs.release_please.outputs.tag_name }}

  docker-publish:
    name: Build and Push Docker Image
    needs: [release_please, goreleaser]
    if: needs.release_please.outputs.release_created
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release_please.outputs.tag_name }}

      # No QEMU: the Dockerfile build stages cross-compile on $BUILDPLATFORM.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set version
        id: version
        run: echo "version=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"
        env:
          TAG_NAME: ${{ needs.release_please.outputs.tag_name }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          cache-from: type=gha,scope=adel-docker
          cache-to: type=gha,mode=max,scope=adel-docker
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/adel:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/adel:latest

  helm-publish:
    if: ${{ needs.release_please.outputs.release_created }}
    needs: [release_please, goreleaser, docker-publish]
    permissions:
      # chart-releaser creates the chart's GitHub release and pushes the
      # index to the gh-pages branch.
      contents: write
    name: Publish Helm Chart
    runs-on: ubuntu-latest
    steps:
      # Chart.yaml version/appVersion were already bumped inside the release
      # PR by release-please, so the tagged commit is the chart to publish.
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ needs.release_please.outputs.tag_name }}

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Verify chart version matches the release
        run: |
          VERSION="${TAG_NAME#v}"
          CHART_VERSION="$(sed -n 's/^version: *\([^ #]*\).*/\1/p' charts/adel/Chart.yaml)"
          if [ "$CHART_VERSION" != "$VERSION" ]; then
            echo "::error file=charts/adel/Chart.yaml::Chart version ${CHART_VERSION} does not match release ${VERSION}"
            exit 1
          fi
        env:
          TAG_NAME: ${{ needs.release_please.outputs.tag_name }}

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@92c6b97fa9f664492a2592e0d1d80bc6bf378957 # v1.9.0
        with:
          charts_dir: charts
          skip_existing: true
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
