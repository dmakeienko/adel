replicaCount: 1

image:
  repository: dmakeienko12/adel
  pullPolicy: IfNotPresent
  # Defaults to .Chart.AppVersion if not set
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080

# Choose one of ingress (networking.k8s.io) or httpRoute (Gateway API) for
# exposing the service. Enabling both is not recommended.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: adel.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # - secretName: adel-tls
  #   hosts:
  #     - adel.example.com

httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: my-gateway
      # namespace: gateway-system
      # sectionName: https
  hostnames:
    - adel.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

# Application config (env vars), see .env.example in the repo for the full reference.
config:
  port: "8080"
  environment: "production"
  readTimeout: "60"
  writeTimeout: "60"
  idleTimeout: "60"

  ad:
    server: ""
    port: "389"
    baseDN: ""
    useSSL: false
    skipTLS: false
    userFilter: "(objectClass=user)"
    groupFilter: "(objectClass=group)"
    searchFilter: "(objectClass=*)"
    searchBaseDN: ""
    excludedObjects: ""
    excludedGroups: ""
    # Maximum entries any single LDAP search may return (applied as the LDAP size limit).
    maxSearchResults: "200"
    # Semicolon-separated group CNs or DNs. Empty allows every authenticated user to search.
    searchAllowedGroups: ""
    # Semicolon-separated group CNs or DNs whose members may reset user passwords.
    # Empty disables password reset for every user.
    passwordResetAllowedGroups: ""
    # Lead/PM scoping. Comma-separated CN suffixes marking a group whose members lead it,
    # e.g. "-lead,-pm". Empty (the default) disables lead detection entirely.
    #
    # Restricting leads to their own teams needs BOTH this and searchAllowedGroups set:
    # with searchAllowedGroups empty every authenticated user stays unrestricted, so
    # suffixes alone derive roles (session, Team tab) without limiting what anyone sees.
    leadGroupSuffixes: ""
    # Replaces the matched suffix in the derived identifier: "engineering-lead" becomes
    # "engineering-*". Only consulted when leadGroupSuffixes is set.
    leadGroupWildcard: "-*"
    # Name of a Secret key holding the CA cert PEM, mounted at /certs/ca/ca.crt when set.
    caCertSecretName: ""
    caCertSecretKey: "ca.crt"

  # Throttling for the password reset endpoint, applied per calling user.
  # Limits are per replica and held in memory, not shared across the cluster.
  rateLimit:
    # Resets allowed per user per window. Set to 0 to disable throttling.
    passwordResetRequests: "10"
    # Window in seconds over which the allowance is replenished.
    passwordResetWindow: "60"

  cors:
    allowedOrigins: "*"
    allowedMethods: "GET,POST,PUT,DELETE,OPTIONS,PATCH"
    allowedHeaders: "Accept,Authorization,Content-Type,X-Session-ID"
    allowCredentials: true
    maxAge: "86400"

  logging:
    level: "info"
    format: "json"

# TLS for the Go server itself (server.crt/server.key). Typically disabled in
# favor of TLS termination at the Ingress; enable only if the server must
# terminate TLS itself.
tls:
  enabled: false
  # Name of a Secret of type kubernetes.io/tls (or generic with tls.crt/tls.key)
  secretName: ""

# Extra environment variables appended as-is (e.g. for secrets via valueFrom).
extraEnv: []

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
